# ─────────────────────────────────────────────────────────────────────────────
# 性能数字一致性闸门（官网侧）
#
# 背景：性能页的表格与结论行由主仓的 golden（docs/perf-numbers.json，从
#   bench-results/*.json 提炼）渲染而来。本仓库不存第二份数字 —— 那正是过去出问题
#   的方式：官网手抄了 2026-11-14 的快照（247ms / 1.22×），主仓 README 与 docs 却
#   已经走到下一批（263ms / 1.03×），同一套材料三个出口各说各话。
#
# 判什么：本仓两页（guide/performance.md、en/guide/performance.md）里的数字块
#   必须与主仓 golden **逐字**一致；不一致直接红。
#
# ⚠ 为什么不用 actions/checkout：本仓的 Actions 策略是 allowed_actions = local_only
#   （只有本仓内的 action 可用），任何 `uses: actions/checkout@v4` 都会让整个工作流
#   在启动阶段就 startup_failure（无 job、无日志，2026-11-17 实测踩到）。所以这里
#   刻意**零 uses**：git clone 取本仓（GITHUB_TOKEN 自带 contents: read），
#   curl 取主仓 golden（GitHub raw，公开只读）。
#
# 为什么不改仓库策略：放宽 allowed_actions 是仓库级安全设置，影响所有工作流；
#   为一条 5 秒的文本校验去放宽它，代价与收益明显不匹配。
# ─────────────────────────────────────────────────────────────────────────────
name: check-perf-numbers

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 UTC 21:07（北京时间 05:07）：主仓夜间跑完基准并刷新 golden 后，本仓次日凌晨
    # 自己发现「页面落后了」；即使没人推本仓，也会有一条红提醒同步。
    - cron: '7 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-perf-numbers
  cancel-in-progress: true

jobs:
  check:
    name: 官网数字 == 主仓 golden
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取本仓（零第三方 action）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # x-access-token:${GH_TOKEN} 是 GitHub 给 Actions 的推荐形式；clone 只读本仓。
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          ls site/scripts/check-perf-numbers.sh >/dev/null

      - name: 校验两页数字块与主仓 golden 一致
        working-directory: site
        run: |
          set -euo pipefail
          # 脚本内部会从 raw 拉主仓 golden 再逐字比对；失败时打印修法。
          # 不加 `| tee`：管道会吃掉退出码，这条闸门必须真的拦得住。
          ./scripts/check-perf-numbers.sh
